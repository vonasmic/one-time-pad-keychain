\* Mutation: each operation locks its own SAE first (LockOrder = "local"); ring as SaeProvision_ring.cfg.
SPECIFICATION Spec
CONSTANTS
  Nodes = {1, 2, 3, 4}
  Edges <- RingEdges
  MaxSessions = 2
  MaxCrashes = 1
  MaxStalls = 0
  MaxAborts = 0
  MaxLost = 0
  OperatorDeletes = FALSE
  RetryOnRefusal = TRUE
  LockOrder = "local"
  FencePeerWrite = TRUE
  DeleteTakesLocks = TRUE
  DeleteChecksSeen = TRUE
  LeaseGuard = TRUE
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT TerminalSuccessMeansConsistentShare
INVARIANT OriginMarkedAfterPeer
INVARIANT MatchingSharesWhenCommitted
INVARIANT NoMismatchedDelivery
INVARIANT CompletedShareNotSilentlyLost
INVARIANT OperatorDeleteOnlyConfirmedShare
INVARIANT OperatorDeleteOnlyRowsPresentAtLock
INVARIANT RemoteFirstDelete
PROPERTY AllSagasFinish
CHECK_DEADLOCK TRUE
